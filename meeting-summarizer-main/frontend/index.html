<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meeting Summarizer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            margin-bottom: 10px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            color: #6b7280;
            font-size: 16px;
        }

        .upload-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            margin-bottom: 25px;
        }

        .upload-area {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        input[type="file"] {
            padding: 8px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            color: #6b7280;
        }

        .results {
            display: none;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
        }

        #transcript {
            line-height: 1.7;
            white-space: pre-wrap;
            color: #374151;
        }

        #summary {
            line-height: 1.7;
            white-space: pre-wrap;
            color: #374151;
        }

        .file-name {
            margin-top: 10px;
            font-size: 14px;
            color: #6b7280;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #9ca3af;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 15px;
            }

            .upload-area {
                flex-direction: column;
                align-items: stretch;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Meeting Summarizer</h1>
        <p>Upload a meeting recording to generate a transcript and AI-powered summary.</p>
    </header>

    <section class="upload-card">

        <div class="upload-area">
            <input type="file" id="audioFile" accept="audio/*">

            <button id="summarizeButton">
                Summarize Meeting
            </button>
        </div>

        <div class="file-name" id="fileName"></div>

        <p id="status"></p>

    </section>

    <main class="results" id="results">

        <section class="card">
            <h2>Transcript</h2>

            <div id="transcript"></div>
        </section>

        <section class="card">
            <h2>AI Summary</h2>

            <div id="summary"></div>
        </section>

    </main>

    <footer>
        Meeting Summarizer · Local AI Processing
    </footer>

</div>

<script>
    const audioFile = document.getElementById("audioFile");
    const summarizeButton = document.getElementById("summarizeButton");

    const fileName = document.getElementById("fileName");
    const status = document.getElementById("status");

    const results = document.getElementById("results");
    const transcript = document.getElementById("transcript");
    const summary = document.getElementById("summary");


    audioFile.addEventListener("change", () => {

        if (audioFile.files.length > 0) {
            fileName.textContent = "Selected file: " + audioFile.files[0].name;
        } else {
            fileName.textContent = "";
        }

    });


    summarizeButton.addEventListener("click", async () => {

        if (!audioFile.files.length) {
            status.textContent = "Please select an audio file.";
            return;
        }

        const formData = new FormData();

        formData.append("file", audioFile.files[0]);

        status.textContent = "Processing audio. This may take a few minutes...";
        summarizeButton.disabled = true;

        results.style.display = "none";

        transcript.textContent = "";
        summary.textContent = "";

        try {

            const response = await fetch(
                "http://127.0.0.1:8000/upload",
                {
                    method: "POST",
                    body: formData
                }
            );

            if (!response.ok) {
                throw new Error("Failed to process the audio file.");
            }

            const data = await response.json();

            transcript.textContent = data.transcript;
            summary.textContent = data.summary;

            results.style.display = "block";

            status.textContent = "Processing complete.";

        } catch (error) {

            status.textContent = error.message;

        } finally {

            summarizeButton.disabled = false;

        }

    });
</script>

</body>
</html>
